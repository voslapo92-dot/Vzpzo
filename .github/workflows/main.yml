name: 🖥️ Windows RDP - fenzz

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: "Tailscale Auth Key (dari tailscale.com/settings/keys)"
        required: true
        type: string
      session_time:
        description: "Durasi sesi (menit, max 360)"
        required: false
        default: "360"
        type: string

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ─────────────────────────────────────────────
      # 1. BERSIH-BERSIH DISK
      # ─────────────────────────────────────────────
      - name: 🧹 Hapus Software Tidak Perlu
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          Write-Host "===== DISK SEBELUM CLEANUP =====" -ForegroundColor Cyan
          Get-PSDrive C | Select-Object @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

          $toDelete = @(
            "C:\Android",
            "C:\android-ndk*",
            "C:\ghc*",
            "C:\msys64",
            "C:\julia*",
            "C:\Miniconda*",
            "C:\ProgramData\Miniconda3",
            "C:\Strawberry",
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\MongoDB",
            "C:\local\boost*",
            "C:\Program Files (x86)\Microsoft SDKs\Azure",
            "C:\Program Files (x86)\Windows Kits\10\Debuggers",
            "C:\hostedtoolcache\windows\go\1.1*",
            "C:\hostedtoolcache\windows\go\1.20*",
            "C:\hostedtoolcache\windows\go\1.21*",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\PyPy",
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\Program Files\LLVM",
            "C:\Program Files\R",
            "C:\Program Files\Microsoft SQL Server\150\LocalDB"
          )

          foreach ($path in $toDelete) {
            $expanded = Get-Item $path -ErrorAction SilentlyContinue
            if ($expanded) {
              foreach ($item in $expanded) {
                Write-Host "Menghapus: $($item.FullName)" -ForegroundColor Yellow
                Remove-Item -Path $item.FullName -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }

          Write-Host ""
          Write-Host "===== DISK SETELAH CLEANUP =====" -ForegroundColor Green
          Get-PSDrive C | Select-Object @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}
          Write-Host "✅ Cleanup selesai!" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 2. BUAT USER fenzz + AKTIFKAN RDP
      # ─────────────────────────────────────────────
      - name: 👤 Buat User fenzz & Aktifkan RDP
        shell: powershell
        env:
          # Password disimpan aman via env variable
          RDP_PASSWORD: "Fenzz@Rdp2024!"
        run: |
          $username = "fenzz"
          $password = $env:RDP_PASSWORD
          $secPassword = ConvertTo-SecureString $password -AsPlainText -Force

          # Hapus user lama kalau ada, biar fresh
          Remove-LocalUser -Name $username -ErrorAction SilentlyContinue

          # Buat user baru
          New-LocalUser -Name $username `
                        -Password $secPassword `
                        -FullName "fenzz" `
                        -Description "RDP User" `
                        -PasswordNeverExpires `
                        -UserMayNotChangePassword

          Write-Host "✅ User $username berhasil dibuat!" -ForegroundColor Green

          # Tambah ke group Admin & RDP
          Add-LocalGroupMember -Group "Administrators"       -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          # Aktifkan RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Type DWord
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Type DWord

          # Buka firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="RDP-fenzz" protocol=TCP dir=in localport=3389 action=allow | Out-Null

          # Restart service RDP
          Set-Service -Name "TermService" -StartupType Automatic
          Restart-Service -Name "TermService" -Force -ErrorAction SilentlyContinue

          Write-Host "✅ RDP aktif! User: $username | Pass: $password" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 3. INSTALL & CONNECT TAILSCALE
      # ─────────────────────────────────────────────
      - name: 🌐 Install Tailscale & Konek
        shell: powershell
        run: |
          Write-Host "Download Tailscale..." -ForegroundColor Cyan
          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
                            -OutFile $installer -UseBasicParsing

          Write-Host "Install Tailscale..." -ForegroundColor Cyan
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait -NoNewWindow

          Start-Sleep -Seconds 5
          Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          & $tsExe up --authkey="${{ github.event.inputs.tailscale_authkey }}" `
                      --hostname="rdp-fenzz" `
                      --accept-routes

          Start-Sleep -Seconds 8
          $tsIP = (& $tsExe ip --4 2>$null).Trim()

          Write-Host ""
          Write-Host "╔══════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║        🖥️  RDP SIAP DIGUNAKAN!        ║" -ForegroundColor Green
          Write-Host "╠══════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  Tailscale IP : $tsIP"                   -ForegroundColor White
          Write-Host "║  Username     : fenzz"                   -ForegroundColor White
          Write-Host "║  Password     : Fenzz@Rdp2024!"          -ForegroundColor White
          Write-Host "║  Port RDP     : 3389"                    -ForegroundColor White
          Write-Host "╠══════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  Buka 'mstsc' lalu masuk IP Tailscale║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════╝" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 4. JAGA SESI TETAP HIDUP
      # ─────────────────────────────────────────────
      - name: ⏳ Jaga Sesi Tetap Aktif
        shell: powershell
        run: |
          $minutes = [int]"${{ github.event.inputs.session_time }}"
          $seconds = $minutes * 60
          Write-Host "Sesi aktif $minutes menit. Tutup workflow kalau sudah selesai." -ForegroundColor Yellow
          Start-Sleep -Seconds $seconds
          
